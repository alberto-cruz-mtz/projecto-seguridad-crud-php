<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar restablecimiento</title>
    <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body class="reset-request-page">
<main class="reset-request-card card" aria-labelledby="reset-request-title">
    <div id="reset-request-loader" class="reset-request-loader" role="status" aria-live="polite" aria-hidden="true">
        <span class="reset-request-spinner" aria-hidden="true"></span>
        <span class="sr-only">Enviando solicitud, espera un momento.</span>
    </div>

    <header class="reset-request-header">
        <h1 id="reset-request-title">Restablece tu contrasena</h1>
        <p>Ingresa tu correo para recibir un enlace de restablecimiento.</p>
    </header>

    <div id="reset-request-message" class="reset-request-message" role="alert" aria-live="assertive"></div>

    <form id="reset-request-form" class="reset-request-form" novalidate>
        <div class="form-field">
            <label for="reset-email">Correo electronico</label>
            <input
                id="reset-email"
                class="form-control"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="correo@empresa.com"
            >
            <p id="reset-email-error" class="error-message" aria-live="polite"></p>
        </div>

        <div class="reset-request-actions">
            <button id="reset-submit" class="btn btn-primary" type="submit">Enviar enlace</button>
            <a class="reset-request-link" href="/login">Volver a inicio de sesion</a>
        </div>
    </form>
</main>

<script type="module" src="/assets/js/login/password-reset-request/index.js"></script>
</body>
</html>
