<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/main.css">
    <title>Restablecer contrasena</title>
</head>
<body class="reset-page">
<main class="reset-shell card" aria-labelledby="reset-title">
    <header class="reset-header">
        <h1 id="reset-title" class="card-title">Restablece tu contrasena</h1>
        <p class="card-subtitle">Ingresa tu correo y define una nueva contrasena para continuar.</p>
    </header>

    <form id="reset-form" class="reset-form" novalidate>
        <div class="form-field">
            <label for="email">Correo electronico</label>
            <input id="email" class="form-control" name="email" type="email" autocomplete="email" required>
        </div>

        <div class="form-field">
            <label for="new_password">Nueva contrasena</label>
            <input
                id="new_password"
                class="form-control"
                name="new_password"
                type="password"
                autocomplete="new-password"
                minlength="8"
                required
            >
        </div>

        <button class="btn btn-primary" type="submit">Actualizar contrasena</button>
    </form>

    <p id="message" class="reset-message" role="status" aria-live="polite"></p>
</main>

<script defer src="/assets/js/reset-password/index.js"></script>
</body>
</html>
